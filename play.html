<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<style>
:root{--bg:#0c0d0f;--panel:#16181b;--line:#2a2e33;--text:#eef0f2;--muted:#9aa1a9;--accent:#1db954;--ink:#04210f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:16px;font-weight:600;line-height:1.4;margin-bottom:12px;word-break:break-word}
video{display:block;width:100%;aspect-ratio:16/9;max-height:78vh;background:#000;border-radius:12px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:600 14px/1 inherit;font-family:inherit;text-decoration:none;cursor:pointer}
.btn:hover{border-color:#3a4047}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h2{font-size:15px;font-weight:600;margin-bottom:8px}
.card div{padding:2px 0;word-break:break-word}
.card .muted{color:var(--muted)}
.card a{color:var(--accent);text-decoration:none;font-size:13px;display:inline-block;margin-top:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){.wrap{padding:0 0 32px}h1{padding:12px 14px 0}video{border-radius:0;max-height:none}.actions,.card{margin-left:14px;margin-right:14px}.btn{flex:1 1 calc(50% - 5px);padding:0 10px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍿 {{ title }}</h1>
  <video id="v" controls playsinline preload="auto" src="{{ file_url }}"></video>

  <div class="actions">
    <a class="btn main" href="{{ file_url }}" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>Download
    </a>
    <button class="btn" id="vlc"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l7 17H5z" opacity=".9"/></svg>Stream in VLC</button>
    <button class="btn" id="mx"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>Stream in MX Player</button>
  </div>

  <div class="card" id="sum">
    <h2>⚡ Quick Media Summary</h2>
    <div class="muted" id="sumBody">Loading details…</div>
    <a href="{{ info_url }}" target="_blank" rel="noopener">Full MediaInfo report</a>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const URL_ = {{ file_url | tojson }};
const TITLE = {{ title | tojson }};
const SUMMARY = {{ summary_url | tojson }};
const $ = id => document.getElementById(id);
const v = $("v");
const ua = navigator.userAgent;
const android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("show"), 3200); }
async function copy() { try { await navigator.clipboard.writeText(URL_); return true; } catch { return false; } }

function androidIntent(pkg) {
  const u = new URL(URL_);
  const fb = encodeURIComponent("https://play.google.com/store/apps/details?id=" + pkg);
  location.href = `intent://${u.host}${u.pathname}${u.search}#Intent;scheme=${u.protocol.replace(":", "")};action=android.intent.action.VIEW;type=video/*;package=${pkg};S.title=${encodeURIComponent(TITLE)};S.browser_fallback_url=${fb};end`;
}
$("vlc").onclick = async () => {
  v.pause();
  if (android) androidIntent("org.videolan.vlc");
  else if (ios) location.href = "vlc-x-callback://x-callback-url/stream?url=" + encodeURIComponent(URL_);
  else { const ok = await copy(); location.href = "vlc://" + URL_; toast(ok ? "Link copied. If VLC didn't open: Media → Open Network Stream → paste." : "Open VLC → Media → Open Network Stream"); }
};
$("mx").onclick = async () => {
  if (android) { v.pause(); androidIntent("com.mxtech.videoplayer.ad"); }
  else { const ok = await copy(); toast(ok ? "Link copied. Paste it in MX Player (Network stream)." : "MX Player works on Android. Use Download instead."); }
};

// try to start with sound; if the browser blocks that, simply wait for the viewer to press play
v.play().catch(() => {});
v.addEventListener("error", () => toast("This format can't play in the browser. Use Download or VLC / MX Player."));

// summary: asked for once, only after playback has started so it never competes with the stream
let asked = false, tries = 0;
function loadSummary() {
  if (asked) return; asked = true;
  fetch(SUMMARY).then(r => r.ok ? r.json() : Promise.reject()).then(s => {
    const rows = [
      ["🎬 Resolution", s.resolution], ["🎞️ Video Codec", s.codec], ["🎨 Bit Depth", s.bit_depth],
      ["⏱️ Duration", s.duration], ["📦 File Size", s.size], ["🔊 Audio Tracks", s.audio], ["💬 Subtitles", s.subs]
    ];
    const body = $("sumBody"); body.className = ""; body.textContent = "";
    rows.forEach(([k, val]) => { const d = document.createElement("div"); d.textContent = `${k}: ${val || "N/A"}`; body.appendChild(d); });
  }).catch(() => { asked = false; $("sumBody").textContent = "Details aren't available right now."; if (++tries < 3) setTimeout(loadSummary, 15000); });
}
v.addEventListener("playing", () => setTimeout(loadSummary, 2500), { once: true });
setTimeout(() => { if (v.paused) loadSummary(); }, 8000);   // viewer hasn't pressed play: still show the details
})();
</script>
</body>
</html>
