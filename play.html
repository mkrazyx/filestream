<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ file_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0d0f; --panel:#16181b; --panel-2:#1e2125; --line:#2a2e33; --text:#eef0f2; --muted:#9aa1a9;
  --accent:#1db954; --accent-ink:#04210f; --danger:#ff6b6b;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.page{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.top h1{font-size:17px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .size{color:var(--muted);font-size:13px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn svg{width:18px;height:18px}

/* ---------- player ---------- */
.player{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.player:fullscreen{border-radius:0;aspect-ratio:auto;width:100%;height:100%}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.player.idle{cursor:none}

.cues{position:absolute;left:6%;right:6%;bottom:72px;text-align:center;pointer-events:none;transition:bottom .2s}
.player.idle .cues{bottom:28px}
.cues span{display:inline-block;max-width:100%;padding:3px 10px 4px;border-radius:6px;background:rgba(0,0,0,.72);color:#fff;line-height:1.35;font-weight:500;font-size:var(--sub,22px);text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:normal}
.player:fullscreen .cues{--sub:32px}

.center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.spinner{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--accent);animation:spin .8s linear infinite;opacity:0;transition:opacity .15s}
.player.busy .spinner{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.bigplay{position:absolute;width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;pointer-events:auto;opacity:0;transform:scale(.9);transition:.15s}
.player.paused:not(.busy) .bigplay{opacity:1;transform:none}
.bigplay svg{width:34px;height:34px;margin-left:3px}

.notice{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(22,24,27,.92);border:1px solid var(--line);padding:8px 8px 8px 14px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92%;white-space:nowrap}
.notice.show{opacity:1;pointer-events:auto}
.notice button{background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:999px;padding:4px 12px;font-size:13px}
.notice button[hidden]{display:none}
.notice.err{border-color:var(--danger)}

.bar{position:absolute;left:0;right:0;bottom:0;padding:44px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.78));transition:opacity .2s,transform .2s}
.player.idle:not(.paused) .bar{opacity:0;transform:translateY(8px);pointer-events:none}
.seek{position:relative;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track{position:relative;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.22);transition:height .12s}
.seek:hover .track,.seek.drag .track{height:6px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.track .buf{background:rgba(255,255,255,.28)}
.track .played{background:var(--accent)}
.knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;transform:scale(0);transition:transform .12s;pointer-events:none}
.seek:hover .knob,.seek.drag .knob,.seek:focus-visible .knob{transform:scale(1)}
.tip{position:absolute;bottom:22px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:2px 8px;border-radius:6px;font-size:12.5px;font-variant-numeric:tabular-nums;opacity:0;pointer-events:none}
.seek:hover .tip,.seek.drag .tip{opacity:1}

.row{display:flex;align-items:center;gap:2px;margin-top:2px}
.row .sp{flex:1}
.ib{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;flex:none}
.ib:hover{background:rgba(255,255,255,.12)}
.ib svg{width:24px;height:24px}
.ib[aria-pressed="true"],.ib.on{color:var(--accent)}
.time{font-size:13.5px;font-variant-numeric:tabular-nums;padding:0 10px;color:#e4e7ea;white-space:nowrap}
.vol{display:flex;align-items:center}
.vol input{width:0;opacity:0;transition:width .15s,opacity .15s;accent-color:var(--accent);height:4px;cursor:pointer}
.vol:hover input,.vol:focus-within input{width:84px;opacity:1;margin:0 8px 0 2px}
input[type=range]{-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.28);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}

/* ---------- settings menu ---------- */
.menu{position:absolute;right:12px;bottom:68px;width:min(320px,calc(100% - 24px));max-height:min(60%,380px);overflow:auto;background:rgba(22,24,27,.97);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu.open{display:block}
.menu h3{font-size:12.5px;font-weight:600;color:var(--muted);padding:10px 10px 4px}
.menu h3 small{font-weight:500;margin-left:6px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:14px}
.opt:hover{background:var(--panel-2)}
.opt[disabled]{opacity:.45;cursor:default}
.opt .ck{width:16px;height:16px;flex:none;color:var(--accent);visibility:hidden}
.opt[aria-checked="true"] .ck{visibility:visible}
.opt .lbl{flex:1;min-width:0}
.opt .lbl small{display:block;color:var(--muted);font-size:12px}
.msg{color:var(--muted);font-size:13px;padding:6px 10px 8px}
.seg{display:flex;gap:4px;padding:2px 6px 8px}
.seg button{flex:1;padding:7px 0;border-radius:8px;background:var(--panel-2);font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.prog{height:3px;border-radius:2px;background:var(--panel-2);margin:2px 10px 8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s}

.hint{color:var(--muted);font-size:13px;margin-top:12px}
.hint kbd{font:inherit;font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:0 6px}
@media (max-width:640px){
  .page{padding:0 0 28px}
  .top{padding:12px 14px 10px;margin:0}
  .top .size{display:none}
  .player{border-radius:0}
  .hint{display:none}
  .ib{width:38px;height:38px}
  .vol{display:none}
  .cues{--sub:17px;bottom:62px}
  .time{padding:0 6px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1 title="{{ file_name }}">{{ file_name }}</h1>
    <span class="size">{{ file_size }}</span>
    <a class="btn" href="{{ file_url }}" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>Download
    </a>
  </header>

  <div class="player paused" id="player">
    <video id="v" playsinline preload="auto"></video>
    <div class="cues" id="cues" aria-live="off"></div>
    <div class="center"><div class="spinner"></div></div>
    <button class="bigplay" id="bigplay" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></button>
    <div class="notice" id="notice"><span id="noticeText"></span><button id="noticeBtn" hidden>Unmute</button></div>

    <div class="menu" id="menu" role="menu"></div>

    <div class="bar" id="bar">
      <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0">
        <div class="track"><i class="buf" id="buf"></i><i class="played" id="played"></i></div>
        <div class="knob" id="knob"></div><div class="tip" id="tip">0:00</div>
      </div>
      <div class="row">
        <button class="ib" id="play" aria-label="Play"></button>
        <button class="ib" id="back" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4.5h4.5"/><text x="12" y="15.6" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" stroke="none" font-family="Figtree,sans-serif">10</text></svg></button>
        <button class="ib" id="fwd" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4.5h-4.5"/><text x="12" y="15.6" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" stroke="none" font-family="Figtree,sans-serif">10</text></svg></button>
        <div class="vol"><button class="ib" id="mute" aria-label="Mute"></button><input type="range" id="vol" min="0" max="1" step="0.01" aria-label="Volume"></div>
        <span class="time" id="time">0:00 / 0:00</span>
        <span class="sp"></span>
        <button class="ib" id="ccBtn" aria-label="Subtitles and audio" aria-haspopup="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10.5 10.2a2.3 2.3 0 1 0 0 3.6M17 10.2a2.3 2.3 0 1 0 0 3.6"/></svg></button>
        <button class="ib" id="pip" aria-label="Picture in picture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="12" y="11" width="7" height="5" rx="1" fill="currentColor"/></svg></button>
        <button class="ib" id="fs" aria-label="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
  </div>
  <p class="hint"><kbd>Space</kbd> play &nbsp; <kbd>←</kbd> <kbd>→</kbd> seek &nbsp; <kbd>↑</kbd> <kbd>↓</kbd> volume &nbsp; <kbd>M</kbd> mute &nbsp; <kbd>C</kbd> subtitles &nbsp; <kbd>F</kbd> fullscreen</p>
</div>

<script>
(() => {
"use strict";
const SRC = {{ file_url | tojson }};
const ID = SRC.split("/").pop();
const BASE = SRC.slice(0, SRC.lastIndexOf("/dl/")) || "";
const $ = id => document.getElementById(id);
const player = $("player"), v = $("v"), menu = $("menu");
const ICON = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>',
  vol: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  low: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6"/></svg>',
  mute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>',
  ck: '<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

/* ---------------- state ---------------- */
const S = {
  info: null,          // /info result
  audio: -1,           // chosen audio track index, -1 = file's default (plain stream, no server work)
  offset: 0,           // seconds: the switched stream starts here
  sub: -1,             // chosen subtitle track, -1 = off
  subs: null,          // {n: [[start,end,html],...]}
  subSize: 1,
  autoMuted: false,
  want: false,         // user wants playback (survives source swaps)
  swapping: false,
};
const store = {
  get(k, d) { try { const x = localStorage.getItem("fs." + k); return x === null ? d : JSON.parse(x); } catch { return d; } },
  set(k, x) { try { localStorage.setItem("fs." + k, JSON.stringify(x)); } catch {} }
};
const fmt = s => {
  if (!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0");
};
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const now = () => v.currentTime + S.offset;
const total = () => (S.info && S.info.duration) || (isFinite(v.duration) ? v.duration + S.offset : 0);

/* ---------------- notices ---------------- */
const notice = $("notice"), noticeText = $("noticeText"), noticeBtn = $("noticeBtn");
let noticeTimer = 0;
function say(text, opts = {}) {
  clearTimeout(noticeTimer);
  noticeText.textContent = text;
  noticeBtn.hidden = !opts.button;
  if (opts.button) noticeBtn.textContent = opts.button;
  notice.classList.toggle("err", !!opts.error);
  notice.classList.add("show");
  if (!opts.sticky) noticeTimer = setTimeout(() => notice.classList.remove("show"), opts.ms || 2600);
}
const hideNotice = () => notice.classList.remove("show");

/* ---------------- volume & sound (the muted-autoplay fix) ----------------
   The sliders always mirror the real element state via 'volumechange'. We try to start with
   sound; only if the browser blocks that do we start muted - and then we say so and unmute on
   the first click/tap/key press. */
const volEl = $("vol"), muteBtn = $("mute");
function syncVolume() {
  const silent = v.muted || v.volume === 0;
  volEl.value = v.muted ? 0 : v.volume;
  muteBtn.innerHTML = silent ? ICON.mute : v.volume < 0.5 ? ICON.low : ICON.vol;
  muteBtn.setAttribute("aria-label", silent ? "Unmute" : "Mute");
  volEl.style.background = `linear-gradient(to right,var(--accent) ${volEl.value * 100}%,rgba(255,255,255,.28) 0)`;
}
v.addEventListener("volumechange", () => {
  syncVolume();
  if (!v.muted) { S.autoMuted = false; if (noticeBtn.textContent === "Unmute") hideNotice(); }
  store.set("vol", v.volume);
});
function unmute() {
  v.muted = false;
  if (v.volume === 0) v.volume = 0.8;
}
volEl.addEventListener("input", () => {
  const x = +volEl.value;
  v.volume = x; v.muted = x === 0;
});
muteBtn.onclick = () => { v.muted || v.volume === 0 ? unmute() : (v.muted = true); };
noticeBtn.onclick = () => { unmute(); hideNotice(); };
v.volume = clamp(store.get("vol", 1), 0, 1);
v.muted = false;
syncVolume();

function tryPlay() {
  S.want = true;
  const p = v.play();
  if (!p) return;
  p.catch(err => {
    if (err && err.name === "NotAllowedError" && !v.muted) {
      v.muted = true; S.autoMuted = true;           // blocked with sound: start silent, but be upfront about it
      v.play().then(() => say("Playing without sound", { button: "Unmute", sticky: true })).catch(() => {});
    } else if (err && err.name !== "AbortError") {
      say("Can't play this video here. Try Download.", { error: true, ms: 6000 });
    }
  });
}
// first real gesture anywhere unmutes an auto-muted start
["pointerdown", "keydown", "touchend"].forEach(ev => addEventListener(ev, () => {
  if (S.autoMuted && v.muted) { unmute(); S.swallow = performance.now(); }   // this tap only unmutes; it must not also pause
}, { capture: true }));

/* ---------------- play / pause / seek ---------------- */
const playBtn = $("play"), seekEl = $("seek");
function setPlayIcon() {
  const paused = v.paused;
  playBtn.innerHTML = paused ? ICON.play : ICON.pause;
  playBtn.setAttribute("aria-label", paused ? "Play" : "Pause");
  player.classList.toggle("paused", paused);
}
const toggle = () => { if (v.paused) tryPlay(); else { S.want = false; v.pause(); } };
v.addEventListener("play", setPlayIcon);
v.addEventListener("pause", () => { if (!S.swapping) setPlayIcon(); });
$("bigplay").onclick = toggle;
playBtn.onclick = toggle;
$("back").onclick = () => seekTo(now() - 10);
$("fwd").onclick = () => seekTo(now() + 10);

const busy = on => player.classList.toggle("busy", on);
v.addEventListener("waiting", () => busy(true));
v.addEventListener("playing", () => { busy(false); setPlayIcon(); });
v.addEventListener("canplay", () => { if (!S.swapping) busy(false); });
v.addEventListener("seeking", () => busy(true));
v.addEventListener("seeked", () => busy(false));

function keyframeBefore(t) {
  const k = S.info && S.info.keyframes;
  if (!k || !k.length) return null;
  let lo = 0, hi = k.length - 1, r = 0;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (k[m] <= t + 0.05) { r = m; lo = m + 1; } else hi = m - 1; }
  return k[r];
}
function bufferedAt(local) {
  for (let i = 0; i < v.buffered.length; i++) if (local >= v.buffered.start(i) - 0.05 && local <= v.buffered.end(i) - 0.3) return true;
  return false;
}
function seekTo(t) {
  const d = total();
  t = clamp(t, 0, d ? Math.max(0, d - 0.5) : t);
  if (S.audio < 0) { v.currentTime = t; return; }                // plain stream: native range seeking
  const local = t - S.offset;
  if (local >= 0 && bufferedAt(local)) { v.currentTime = local; return; }
  loadSource(S.audio, t);                                         // switched stream: restart from the right keyframe
}

/* ---------------- source switching (audio tracks) ---------------- */
let loadToken = 0;
async function loadSource(a, t) {
  const token = ++loadToken;
  const wasPlaying = S.want || !v.paused;
  const rate = v.playbackRate;
  S.swapping = true; busy(true);
  let start = t;
  if (a >= 0) {
    const kf = keyframeBefore(t);
    if (kf !== null) start = kf;
    else if (!(S.info && S.info.keyframes) && t > 0) {            // non-MKV file: ask the server for the keyframe
      try { const r = await fetch(`${BASE}/seekpoint/${ID}?t=${t.toFixed(3)}`); if (r.ok) start = (await r.json()).start; } catch {}
      if (token !== loadToken) return;
    }
  }
  S.audio = a; S.offset = a >= 0 ? start : 0;
  v.defaultPlaybackRate = rate;
  v.src = a >= 0 ? `${BASE}/audio/${ID}?a=${a}&t=${start.toFixed(3)}` : SRC;
  const ready = () => {
    v.removeEventListener("loadedmetadata", ready);
    if (token !== loadToken) return;
    if (a < 0 && t > 0) v.currentTime = t;
    v.playbackRate = rate;
    S.swapping = false;
    if (wasPlaying) tryPlay(); else busy(false);
  };
  v.addEventListener("loadedmetadata", ready);
  v.load();
}
v.addEventListener("error", () => {
  if (S.swapping && S.audio >= 0) {
    const bad = S.audio, t = S.offset;
    S.swapping = false; busy(false);
    say("This audio track could not be played. Back to the original.", { error: true, ms: 5000 });
    markAudio(-1);
    loadSource(-1, t);
  } else if (!S.swapping) {
    busy(false);
    say("Playback error. Try again or use Download.", { error: true, ms: 6000 });
  }
});
function nativeAudio() {
  const a = (S.info && S.info.audio) || [];
  const i = a.findIndex(x => x.default);
  return i < 0 ? 0 : i;
}
function pickAudio(n) {
  hideMenu();
  const native = nativeAudio();
  if (n === native && S.audio < 0) return;
  if (n === S.audio) return;
  markAudio(n === native ? -1 : n, n);
  say("Switching audio…", { ms: 1800 });
  loadSource(n === native ? -1 : n, now());
}
let shownAudio = null;
function markAudio(real, shown) { shownAudio = shown === undefined ? (real < 0 ? nativeAudio() : real) : shown; renderMenu(); }

/* ---------------- timeline ---------------- */
const played = $("played"), buf = $("buf"), knob = $("knob"), tip = $("tip"), timeEl = $("time");
let dragging = false;
function paint() {
  const d = total(), t = now();
  const p = d ? clamp(t / d, 0, 1) : 0;
  played.style.width = knob.style.left = p * 100 + "%";
  let end = 0;
  for (let i = 0; i < v.buffered.length; i++) if (v.buffered.start(i) <= v.currentTime + 0.5) end = Math.max(end, v.buffered.end(i));
  buf.style.width = d ? clamp((end + S.offset) / d, 0, 1) * 100 + "%" : "0";
  if (!dragging) timeEl.textContent = fmt(t) + " / " + fmt(d);
  seekEl.setAttribute("aria-valuemax", Math.round(d)); seekEl.setAttribute("aria-valuenow", Math.round(t));
}
function frac(e) { const r = seekEl.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1); }
seekEl.addEventListener("pointermove", e => {
  const f = frac(e); tip.style.left = f * 100 + "%"; tip.textContent = fmt(f * total());
  if (dragging) { played.style.width = knob.style.left = f * 100 + "%"; timeEl.textContent = fmt(f * total()) + " / " + fmt(total()); }
});
seekEl.addEventListener("pointerdown", e => { dragging = true; seekEl.classList.add("drag"); seekEl.setPointerCapture(e.pointerId); seekEl.dispatchEvent(new PointerEvent("pointermove", e)); });
seekEl.addEventListener("pointerup", e => { if (!dragging) return; dragging = false; seekEl.classList.remove("drag"); seekTo(frac(e) * total()); });
seekEl.addEventListener("pointercancel", () => { dragging = false; seekEl.classList.remove("drag"); });
seekEl.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") { seekTo(now() - 5); e.preventDefault(); e.stopPropagation(); }
  if (e.key === "ArrowRight") { seekTo(now() + 5); e.preventDefault(); e.stopPropagation(); }
});
v.addEventListener("progress", paint);
v.addEventListener("durationchange", paint);

/* ---------------- subtitles ---------------- */
const cuesEl = $("cues");
let cueList = [], cueIdx = 0, lastCue = "";
function setSubTrack(n) {
  S.sub = n; store.set("sub", n);
  cueList = n >= 0 && S.subs && S.subs[n] ? S.subs[n] : [];
  cueIdx = 0; lastCue = "\u0000"; renderCue(); renderMenu();
}
function renderCue() {
  let html = "";
  if (cueList.length) {
    const t = now() - 0.02;
    // binary search the last cue that starts <= t, then step back over overlapping ones
    let lo = 0, hi = cueList.length - 1, k = -1;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (cueList[m][0] <= t) { k = m; lo = m + 1; } else hi = m - 1; }
    const out = [];
    for (let i = k; i >= 0 && i > k - 6; i--) if (cueList[i][1] > t) out.unshift(cueList[i][2]);
    html = out.map(h => `<span>${h}</span>`).join("<br>");
  }
  if (html !== lastCue) { cuesEl.innerHTML = html; lastCue = html; }
}
function applySubSize() { player.style.setProperty("--sub", [16, 22, 30][S.subSize] + "px"); }

let subsFetched = false;
async function loadSubs() {
  if (subsFetched) return; subsFetched = true;
  try {
    const r = await fetch(`${BASE}/subs/${ID}`);
    if (!r.ok) { subsFetched = false; return; }
    S.subs = (await r.json()).tracks;
    const want = store.get("sub", -1);
    if (want >= 0 && S.subs[want]) setSubTrack(want); else renderMenu();
  } catch { subsFetched = false; }
}

/* ---------------- one-shot track info ---------------- */
async function loadInfo() {
  for (let tries = 0; tries < 60; tries++) {
    try {
      const r = await fetch(`${BASE}/info/${ID}`, { cache: "no-store" });
      const j = r.ok ? await r.json() : { status: "error" };
      if (j.status === "ready") { applyInfo(j); return; }
      if (j.status === "error") { S.info = { status: "error", audio: [], subs: [] }; renderMenu(); return; }
    } catch {}
    await new Promise(r => setTimeout(r, 2500));
  }
}
let subPoll = 0;
function applyInfo(j) {
  const first = !S.info || S.info.status !== "ready";
  S.info = j;
  if (first) shownAudio = nativeAudio();
  if (j.subs_state === "ready") loadSubs();
  else if (j.subs_state === "working" && !subPoll) {
    subPoll = setInterval(async () => {
      try {
        const r = await fetch(`${BASE}/info/${ID}`, { cache: "no-store" }); const k = await r.json();
        if (k.status === "ready") { S.info.subs_state = k.subs_state; S.info.subs_progress = k.subs_progress; if (k.subs_state !== "working") { clearInterval(subPoll); subPoll = 0; if (k.subs_state === "ready") loadSubs(); } renderMenu(); }
      } catch {}
    }, 4000);
  }
  renderMenu(); paint();
}

/* ---------------- settings menu ---------------- */
const LANG = (() => { try { return new Intl.DisplayNames(["en"], { type: "language" }); } catch { return null; } })();
function langName(code) {
  if (!code) return "";
  try { return (LANG && LANG.of(code.length === 3 ? ISO3[code] || code : code)) || code; } catch { return code; }
}
const ISO3 = { eng: "en", hin: "hi", tam: "ta", tel: "te", mal: "ml", kan: "kn", ben: "bn", mar: "mr", pan: "pa", guj: "gu", urd: "ur", jpn: "ja", kor: "ko", chi: "zh", zho: "zh", spa: "es", fre: "fr", fra: "fr", ger: "de", deu: "de", ita: "it", por: "pt", rus: "ru", ara: "ar", tha: "th", tur: "tr", ind: "id", may: "ms", msa: "ms", vie: "vi", dut: "nl", nld: "nl", pol: "pl", swe: "sv", heb: "he", per: "fa", fas: "fa" };
const CH = { 1: "Mono", 2: "Stereo", 6: "5.1", 8: "7.1" };
function trackLabel(t, i, kind) {
  const lang = langName(t.lang);
  let title = (t.title || "").trim();
  const main = lang && !title.toLowerCase().includes(lang.toLowerCase()) ? lang : "";
  const name = [main, title].filter(Boolean).join(" · ") || `${kind} ${i + 1}`;
  const meta = kind === "Audio" ? [t.codec && t.codec.toUpperCase(), CH[t.channels] || (t.channels ? t.channels + "ch" : "")].filter(Boolean).join(" · ")
                                : [t.forced ? "Forced" : "", t.codec === "ass" ? "Styled" : ""].filter(Boolean).join(" · ");
  return { name, meta };
}
function opt(label, meta, checked, onclick, disabled) {
  const b = document.createElement("button");
  b.className = "opt"; b.setAttribute("role", "menuitemradio"); b.setAttribute("aria-checked", checked ? "true" : "false");
  if (disabled) b.disabled = true;
  b.innerHTML = ICON.ck + `<span class="lbl"></span>`;
  b.querySelector(".lbl").textContent = label;
  if (meta) { const s = document.createElement("small"); s.textContent = meta; b.querySelector(".lbl").appendChild(s); }
  b.onclick = onclick;
  return b;
}
function renderMenu() {
  const keep = menu.scrollTop;
  menu.textContent = "";
  const info = S.info;
  const add = (tag, text, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; e.textContent = text; menu.appendChild(e); return e; };

  add("h3", "Audio");
  if (!info) add("p", "Reading tracks…", "msg");
  else if (info.status === "error") add("p", "Track list unavailable for this file.", "msg");
  else if (!info.audio.length) add("p", "No audio tracks found.", "msg");
  else if (info.audio.length === 1) { const l = trackLabel(info.audio[0], 0, "Audio"); menu.appendChild(opt(l.name, l.meta, true, hideMenu)); }
  else info.audio.forEach((t, i) => { const l = trackLabel(t, i, "Audio"); menu.appendChild(opt(l.name, l.meta, i === shownAudio, () => pickAudio(i))); });

  const h = add("h3", "Subtitles");
  if (info && info.status === "ready") {
    const st = info.subs_state;
    if (!info.subs.length || st === "none") { add("p", "This file has no subtitles.", "msg"); }
    else {
      if (st === "working") {
        const pr = info.subs_progress; h.innerHTML = ""; h.textContent = "Subtitles";
        const sm = document.createElement("small"); sm.textContent = pr != null ? `preparing ${Math.round(pr * 100)}%` : "preparing…"; h.appendChild(sm);
        if (pr != null) { const bar = document.createElement("div"); bar.className = "prog"; bar.innerHTML = `<i style="width:${Math.round(pr * 100)}%"></i>`; menu.appendChild(bar); }
      }
      const ready = !!S.subs;
      menu.appendChild(opt("Off", "", S.sub < 0, () => { setSubTrack(-1); }));
      info.subs.forEach((t, i) => {
        const l = trackLabel(t, i, "Subtitle");
        const usable = t.text && ready && S.subs[i];
        menu.appendChild(opt(l.name, !t.text ? "Image-based, can't be shown" : (ready ? l.meta : "Not ready yet"), S.sub === i, () => { setSubTrack(i); hideMenu(); }, !usable));
      });
      if (st === "skipped") add("p", "Subtitles aren't prepared automatically for files this large.", "msg");
      if (st === "failed") add("p", "Couldn't read the subtitles from this file.", "msg");
      add("h3", "Subtitle size");
      const seg = document.createElement("div"); seg.className = "seg";
      ["Small", "Medium", "Large"].forEach((n, i) => { const b = document.createElement("button"); b.textContent = n; b.setAttribute("aria-pressed", S.subSize === i); b.onclick = () => { S.subSize = i; store.set("subsize", i); applySubSize(); renderMenu(); }; seg.appendChild(b); });
      menu.appendChild(seg);
    }
  } else add("p", info ? "Subtitles unavailable." : "Reading tracks…", "msg");

  add("h3", "Speed");
  const seg = document.createElement("div"); seg.className = "seg";
  [0.75, 1, 1.25, 1.5, 2].forEach(r => { const b = document.createElement("button"); b.textContent = r + "×"; b.setAttribute("aria-pressed", v.playbackRate === r); b.onclick = () => { v.playbackRate = r; v.defaultPlaybackRate = r; renderMenu(); }; seg.appendChild(b); });
  menu.appendChild(seg);
  menu.scrollTop = keep;
}
const ccBtn = $("ccBtn");
function hideMenu() { menu.classList.remove("open"); ccBtn.classList.remove("on"); }
function toggleMenu() { menu.classList.toggle("open"); ccBtn.classList.toggle("on", menu.classList.contains("open")); if (menu.classList.contains("open")) renderMenu(); }
ccBtn.onclick = e => { e.stopPropagation(); toggleMenu(); };
menu.addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", e => { if (!menu.contains(e.target)) hideMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") hideMenu(); });
v.addEventListener("ratechange", () => { if (menu.classList.contains("open")) renderMenu(); });

/* ---------------- fullscreen, PiP, idle, clicks, keys ---------------- */
const fsBtn = $("fs");
fsBtn.onclick = () => document.fullscreenElement ? document.exitFullscreen() : (player.requestFullscreen || player.webkitRequestFullscreen || (() => v.webkitEnterFullscreen && v.webkitEnterFullscreen())).call(player);
$("pip").onclick = async () => { try { document.pictureInPictureElement ? await document.exitPictureInPicture() : await v.requestPictureInPicture(); } catch {} };
if (!document.pictureInPictureEnabled) $("pip").style.display = "none";

let idleT = 0;
function wake() { player.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { if (!v.paused && !menu.classList.contains("open")) player.classList.add("idle"); }, 2600); }
["pointermove", "pointerdown", "keydown"].forEach(e => player.addEventListener(e, wake));
player.addEventListener("pointerleave", () => { if (!v.paused) player.classList.add("idle"); });

let clickT = 0;
v.addEventListener("click", () => {
  if (matchMedia("(pointer:coarse)").matches && player.classList.contains("idle")) { wake(); return; }
  if (S.swallow && performance.now() - S.swallow < 600) return;
  clearTimeout(clickT); clickT = setTimeout(toggle, 220);
});
v.addEventListener("dblclick", () => { clearTimeout(clickT); fsBtn.click(); });

document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase(); let used = true;
  if (k === " " || k === "k") { if (e.target.closest("button")) return; toggle(); }
  else if (k === "arrowleft" || k === "j") seekTo(now() - (k === "j" ? 10 : 5));
  else if (k === "arrowright" || k === "l") seekTo(now() + (k === "l" ? 10 : 5));
  else if (k === "arrowup") { v.muted = false; v.volume = clamp(v.volume + 0.05, 0, 1); }
  else if (k === "arrowdown") v.volume = clamp(v.volume - 0.05, 0, 1);
  else if (k === "m") muteBtn.click();
  else if (k === "f") fsBtn.click();
  else if (k === "c") { if (S.subs && S.info) { const n = S.sub >= 0 ? -1 : Math.max(0, S.info.subs.findIndex((t, i) => t.text && S.subs[i])); setSubTrack(n); say(n < 0 ? "Subtitles off" : "Subtitles on"); } else say("Subtitles aren't ready yet"); }
  else used = false;
  if (used) { e.preventDefault(); wake(); }
});

/* ---------------- media session (lock screen controls) ---------------- */
if ("mediaSession" in navigator) {
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: {{ file_name | tojson }} });
    navigator.mediaSession.setActionHandler("play", tryPlay);
    navigator.mediaSession.setActionHandler("pause", () => { S.want = false; v.pause(); });
    navigator.mediaSession.setActionHandler("seekbackward", () => seekTo(now() - 10));
    navigator.mediaSession.setActionHandler("seekforward", () => seekTo(now() + 10));
  } catch {}
}

/* ---------------- start ---------------- */
S.subSize = store.get("subsize", 1); applySubSize();
setPlayIcon(); renderMenu(); wake();
(function loop() { paint(); renderCue(); requestAnimationFrame(loop); })();
v.src = SRC;
tryPlay();
loadInfo();
})();
</script>
</body>
</html>
